name: Publier GEKKO Token Scaler

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4

      - name: Verifier le module
        run: |
          node --check scripts/main.mjs
          node --test tests/*.test.mjs

      - name: Lire la version du manifeste
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('module.json', 'utf8')).version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version invalide : $VERSION" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Construire le ZIP installable Foundry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/gekko-token-scaler/scripts dist/gekko-token-scaler/styles
          cp module.json README.md LICENSE dist/gekko-token-scaler/
          cp scripts/*.mjs dist/gekko-token-scaler/scripts/
          cp styles/*.css dist/gekko-token-scaler/styles/
          (cd dist && zip -q -r ../gekko-token-scaler.zip gekko-token-scaler)
          unzip -tq gekko-token-scaler.zip

      - name: Publier la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La version $TAG existe deja, aucune publication en double."
          else
            gh release create "$TAG" gekko-token-scaler.zip \
              --target "$GITHUB_SHA" \
              --title "GEKKO Token Scaler $TAG" \
              --notes "Version $TAG du module Foundry VTT V14. Installer via l'URL de manifeste indiquee dans le README." \
              --latest
          fi
